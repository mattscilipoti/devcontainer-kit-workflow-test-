# Remind the project to revisit the browser sandbox workaround without AI.
name: Lighthouse sandbox review
on:
  schedule:
    - cron: "17 6 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open a review issue if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Review Lighthouse Chromium sandbox security"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Review Lighthouse Chromium sandbox security" in:title' \
            --json number,title \
            --jq 'map(select(.title == "Review Lighthouse Chromium sandbox security")) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Review issue #$existing is already open."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
              "Review whether Lighthouse can run with Chromium's sandbox enabled and Docker's default security settings. Test a safer approach in a scratch container before changing the project. Until then, use --no-sandbox only for trusted pages; the container can access its mounted files, credentials, and network."
          fi
